name: Android APK — WarLike Hub
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release_signed:
        description: Build a signed release APK (requires signing secrets)
        type: boolean
        default: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/platform-tools"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: WarLike-Android-Hub-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Prepare secure release signing
        if: github.event_name == 'workflow_dispatch' && inputs.release_signed
        env:
          WARLIKE_KEYSTORE_BASE64: ${{ secrets.WARLIKE_KEYSTORE_BASE64 }}
          WARLIKE_KEYSTORE_PASSWORD: ${{ secrets.WARLIKE_KEYSTORE_PASSWORD }}
          WARLIKE_KEY_ALIAS: ${{ secrets.WARLIKE_KEY_ALIAS }}
          WARLIKE_KEY_PASSWORD: ${{ secrets.WARLIKE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$WARLIKE_KEYSTORE_BASE64"
          test -n "$WARLIKE_KEYSTORE_PASSWORD"
          test -n "$WARLIKE_KEY_ALIAS"
          test -n "$WARLIKE_KEY_PASSWORD"
          echo "::add-mask::$WARLIKE_KEYSTORE_PASSWORD"
          echo "::add-mask::$WARLIKE_KEY_PASSWORD"
          printf '%s' "$WARLIKE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/warlike-release.jks"
          chmod 600 "$RUNNER_TEMP/warlike-release.jks"
          echo "WARLIKE_KEYSTORE_PATH=$RUNNER_TEMP/warlike-release.jks" >> "$GITHUB_ENV"
      - name: Build signed release
        if: github.event_name == 'workflow_dispatch' && inputs.release_signed
        env:
          WARLIKE_KEYSTORE_PASSWORD: ${{ secrets.WARLIKE_KEYSTORE_PASSWORD }}
          WARLIKE_KEY_ALIAS: ${{ secrets.WARLIKE_KEY_ALIAS }}
          WARLIKE_KEY_PASSWORD: ${{ secrets.WARLIKE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleRelease
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
      - name: Publish signed release artifact
        if: github.event_name == 'workflow_dispatch' && inputs.release_signed
        uses: actions/upload-artifact@v4
        with:
          name: WarLike-Android-Hub-signed-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/warlike-release.jks"
  emulator:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Emulator smoke tests (Android 35)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_3a
          script: gradle --no-daemon :app:connectedDebugAndroidTest
